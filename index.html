<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel PenSound - Lote Flexível</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; background: #121212; color: #fff; }
        input, select, button { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; background: #1e1e1e; color: #fff; border: 1px solid #333; border-radius: 4px; }
        button { font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit { background: #6200ee; color: white; border: none; padding: 12px; margin-top: 20px; }
        .btn-add { background: #03dac6; color: #000; border: none; }
        button:disabled { background: #444; color: #888; }
        .pack-card { background: #1a1a1a; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #2a2a2a; }
        .pack-card h3 { margin-top: 0; color: #bb86fc; }
    </style>
</head>
<body>
    <h2>PenSound - Envio em Lote</h2>
    <form id="packForm">
        
        <div id="cardsContainer">
            <!-- PACOTE 1 INICIAL -->
            <div class="pack-card">
                <h3>Pacote 1</h3>
                <input type="text" class="nome" required placeholder="Nome Ex: Pagodão 2026">
                <select class="categoria" required>
                    <option value="PAGODAO">PAGODÃO</option>
                    <option value="ARROCHA">ARROCHA</option>
                    <option value="FORRO">FORRÓ</option>
                    <option value="FUNK">FUNK</option>
                    <option value="REPERTORIO">REPERTÓRIO</option>
                    <option value="OUTROS">OUTROS</option>
                </select>
                <input type="file" class="capa" accept="image/*" required>
                <input type="url" class="download" required placeholder="Link Direto do ZIP">
            </div>
        </div>

        <button type="button" id="btnAddPack" class="btn-add">+ Adicionar Mais Um Pacote</button>

        <br><br>
        <label>Token do GitHub (PAT):</label>
        <input type="password" id="ghToken" required placeholder="ghp_xxxx...">
        
        <button type="submit" id="btnSubmit" class="btn-submit">Publicar Todos os Pacotes</button>
    </form>

    <script>
        const CLOUD_NAME = "y5u5zkp7";
        const UPLOAD_PRESET = "ftpuvxis";
        const REPO = "thsize/botpensound";

        let packCount = 1;

        // Adiciona um novo formulário de pacote na tela ao clicar no botão
        document.getElementById('btnAddPack').addEventListener('click', () => {
            packCount++;
            const container = document.getElementById('cardsContainer');
            const cardDiv = document.createElement('div');
            cardDiv.className = 'pack-card';
            cardDiv.innerHTML = `
                <h3>Pacote ${packCount}</h3>
                <input type="text" class="nome" placeholder="Nome do Pacote">
                <select class="categoria">
                    <option value="PAGODAO">PAGODÃO</option>
                    <option value="ARROCHA">ARROCHA</option>
                    <option value="FORRO">FORRÓ</option>
                    <option value="FUNK">FUNK</option>
                    <option value="REPERTORIO">REPERTÓRIO</option>
                    <option value="OUTROS">OUTROS</option>
                </select>
                <input type="file" class="capa" accept="image/*">
                <input type="url" class="download" placeholder="Link Direto do ZIP">
            `;
            container.appendChild(cardDiv);
        });

        // Envio do formulário em lote
        document.getElementById('packForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;

            try {
                const token = document.getElementById('ghToken').value;
                const cards = document.querySelectorAll('.pack-card');
                
                btn.innerText = "Lendo repositório...";
                const ghUrl = `https://api.github.com/repos/${REPO}/contents/pacotes.json`;
                const currentData = await fetch(ghUrl).then(r => r.json());
                const contentText = decodeURIComponent(escape(atob(currentData.content)));
                const content = JSON.parse(contentText);

                let pacotesAdicionados = 0;

                for (let i = 0; i < cards.length; i++) {
                    const card = cards[i];
                    const nome = card.querySelector('.nome').value.trim();
                    const categoria = card.querySelector('.categoria').value;
                    const fileInput = card.querySelector('.capa');
                    const file = fileInput.files ? fileInput.files[0] : null;
                    const download = card.querySelector('.download').value.trim();

                    if (nome && file && download) {
                        btn.innerText = `Enviando capa ${i + 1} de ${cards.length}...`;

                        const formData = new FormData();
                        formData.append('file', file);
                        formData.append('upload_preset', UPLOAD_PRESET);

                        const resImg = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                            method: 'POST',
                            body: formData
                        }).then(r => r.json());

                        if (!resImg.secure_url) {
                            throw new Error(`Falha no upload da foto do Pacote ${i + 1}`);
                        }

                        content.push({
                            id: (Date.now() + i).toString(),
                            nome: nome,
                            title: nome,
                            categoria: categoria,
                            type: categoria,
                            capa: resImg.secure_url,
                            cover_url: resImg.secure_url,
                            download: download,
                            zip_url: download
                        });

                        pacotesAdicionados++;
                    }
                }

                if (pacotesAdicionados === 0) {
                    throw new Error("Preencha as informações do pacote completamente!");
                }

                btn.innerText = "Atualizando GitHub...";
                const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2))));

                const ghRes = await fetch(ghUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Adicionados ${pacotesAdicionados} pacotes em lote`,
                        content: updatedContent,
                        sha: currentData.sha
                    })
                });

                if (!ghRes.ok) throw new Error("Erro ao salvar no GitHub. Verifique o seu token PAT.");

                alert(`${pacotesAdicionados} pacote(s) publicado(s) com sucesso!`);
                location.reload();
            } catch (err) {
                alert('Erro ao publicar: ' + err.message);
                btn.disabled = false;
                btn.innerText = "Publicar Todos os Pacotes";
            }
        });
    </script>
</body>
</html>
