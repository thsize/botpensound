<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel PenSound - Gestão e Envio</title>
    
    <!-- Lib para assinar a chave privada RSA do Firebase V1 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.5.26/jsrsasign-all-min.js"></script>
    
    <!-- SDKs do Firebase Firestore -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-dark: #1E1E2E;
            --card-bg: #313244;
            --card-inner: #181825;
            --text-main: #CDD6F4;
            --text-sub: #A6ADC8;
            --accent-blue: #89B4FA;
            --accent-green: #A6E3A1;
            --accent-gold: #F9E2AF;
            --accent-purple: #CBA6F7;
            --danger: #F38BA8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 30px 20px;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        .header-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-title h1 {
            font-size: 26px;
            color: #FFFFFF;
            margin: 0 0 8px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header-title p {
            color: var(--text-sub);
            font-size: 14px;
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-vip h3 { color: var(--accent-gold); }
        .card-pack h3 { color: var(--accent-purple); }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 6px;
            margin-top: 12px;
        }

        input[type="text"],
        input[type="password"],
        input[type="url"],
        select {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--card-inner);
            color: #FFFFFF;
            border: 1px solid #45475A;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(137, 180, 250, 0.2);
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            background-color: var(--card-inner);
            border: 1px dashed #45475A;
            border-radius: 8px;
            color: var(--text-sub);
            box-sizing: border-box;
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.2s ease;
            margin-top: 12px;
        }

        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-vip {
            background-color: var(--accent-gold);
            color: #11111B;
        }

        .btn-add {
            background-color: var(--card-inner);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .btn-submit {
            background-color: var(--accent-purple);
            color: #11111B;
            font-size: 15px;
            margin-top: 20px;
        }

        .chave-resultado {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-green);
            text-align: center;
            margin-top: 14px;
            padding: 12px;
            background-color: var(--card-inner);
            border-radius: 8px;
            border: 1px solid var(--accent-green);
            word-break: break-all;
            user-select: all;
        }

        .pack-item {
            background-color: var(--card-inner);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px solid #45475A;
        }

        .pack-item h4 {
            margin: 0 0 12px 0;
            color: var(--accent-blue);
            font-size: 15px;
        }

        hr.divider {
            border: 0;
            height: 1px;
            background: #45475A;
            margin: 30px 0;
        }
    </style>
</head>
<body>

    <div class="header-title">
        <h1>⚡ PenSound Admin</h1>
        <p>Gerenciador de Chaves VIP e Envio de Pacotes</p>
    </div>

    <!-- SEÇÃO: GERADOR DE CHAVES VIP -->
    <div class="card card-vip">
        <h3>👑 Gerador de Chaves VIP</h3>
        
        <label for="vipTipoPlano">Selecione o Plano:</label>
        <select id="vipTipoPlano">
            <option value="mensal">Mensal (30 Dias)</option>
            <option value="vitalicio">Vitalício (Para Sempre)</option>
        </select>
        
        <button type="button" id="btnGerarVip" class="btn-vip">GERAR E SALVAR CHAVE NO BANCO</button>

        <div id="boxResultadoVip" style="display: none;">
            <div class="chave-resultado" id="txtChaveGerada">---</div>
        </div>
    </div>

    <hr class="divider">

    <!-- SEÇÃO: ENVIO DE PACOTES EM LOTE -->
    <div class="card card-pack">
        <h3>📦 Envio de Pacotes em Lote</h3>
        <form id="packForm">
            
            <div id="cardsContainer">
                <!-- PACOTE 1 -->
                <div class="pack-item">
                    <h4>Pacote 1</h4>
                    
                    <label>Nome do Pacote:</label>
                    <input type="text" class="input-nome" placeholder="Ex: MUDANÇA DE REPERTÓRIO" required>
                    
                    <label>Categoria:</label>
                    <select class="input-categoria">
                        <option value="PAGODAO">PAGODÃO</option>
                        <option value="ARROCHA">ARROCHA</option>
                        <option value="FORRO">FORRÓ</option>
                        <option value="FUNK">FUNK</option>
                        <option value="REPERTORIO">REPERTÓRIO</option>
                        <option value="OUTROS">OUTROS</option>
                    </select>
                    
                    <label>Capa do Pack (Imagem):</label>
                    <input type="file" class="input-capa" accept="image/*" required>
                    
                    <label>Link Direto do ZIP:</label>
                    <input type="url" class="input-download" placeholder="https://..." required>
                </div>
            </div>

            <button type="button" id="btnAddPack" class="btn-add">+ Adicionar Mais Um Pacote</button>

            <label style="margin-top: 20px;">Token do GitHub (PAT):</label>
            <input type="password" id="ghToken" required placeholder="ghp_xxxx...">

            <button type="submit" id="btnSubmit" class="btn-submit">PUBLICAR E NOTIFICAR APP</button>
        </form>
    </div>

        // INICIALIZAÇÃO CORRETA DO FIREBASE WEB CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyCj2BQbTndcnjsfTvvynfG9uomjkdeFWHs",
            authDomain: "painel-sky.firebaseapp.com",
            projectId: "painel-sky",
            storageBucket: "painel-sky.firebasestorage.app",

        }
        const db = firebase.firestore();

        // LÓGICA DO GERADOR DE CHAVES VIP
        document.getElementById('btnGerarVip').addEventListener('click', async () => {
            const tipo = document.getElementById('vipTipoPlano').value;
            const btn = document.getElementById('btnGerarVip');
            const boxResult = document.getElementById('boxResultadoVip');
            const txtChave = document.getElementById('txtChaveGerada');

            btn.disabled = true;
            btn.innerText = "Gerando...";

            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let p1 = '', p2 = '';
            for (let i = 0; i < 4; i++) {
                p1 += chars.charAt(Math.floor(Math.random() * chars.length));
                p2 += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            const novaChave = `PENSOUND-${p1}-${p2}`;

            try {
                await db.collection("chaves_vip").doc(novaChave).set({
                    utilizada: false,
                    device_id: "",
                    tipo: tipo
                });

                txtChave.innerText = novaChave;
                boxResult.style.display = 'block';
            } catch (err) {
                console.error("Erro ao gravar chave:", err);
                alert("Erro ao gravar chave no Firebase: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "GERAR E SALVAR CHAVE NO BANCO";
            }
        });

        // LÓGICA DE PACOTES MULTIPLOS
        let packCount = 1;

        document.getElementById('btnAddPack').addEventListener('click', () => {
            packCount++;
            const container = document.getElementById('cardsContainer');
            const cardDiv = document.createElement('div');
            cardDiv.className = 'pack-item';
            cardDiv.innerHTML = `
                <h4>Pacote ${packCount}</h4>
                
                <label>Nome do Pacote:</label>
                <input type="text" class="input-nome" placeholder="Nome do Pacote ${packCount}" required>
                
                <label>Categoria:</label>
                <select class="input-categoria">
                    <option value="PAGODAO">PAGODÃO</option>
                    <option value="ARROCHA">ARROCHA</option>
                    <option value="FORRO">FORRÓ</option>
                    <option value="FUNK">FUNK</option>
                    <option value="REPERTORIO">REPERTÓRIO</option>
                    <option value="OUTROS">OUTROS</option>
                </select>
                
                <label>Capa do Pack (Imagem):</label>
                <input type="file" class="input-capa" accept="image/*" required>
                
                <label>Link Direto do ZIP:</label>
                <input type="url" class="input-download" placeholder="https://..." required>
            `;
            container.appendChild(cardDiv);
        });

        async function getFirebaseAccessToken() {
            const now = Math.floor(Date.now() / 1000);
            const claim = {
                iss: FIREBASE_CLIENT_EMAIL,
                scope: "https://www.googleapis.com/auth/firebase.messaging",
                aud: "https://oauth2.googleapis.com/token",
                exp: now + 3600,
                iat: now
            };

            const header = { alg: "RS256", typ: "JWT" };
            const sHeader = JSON.stringify(header);
            const sClaim = JSON.stringify(claim);
            const jwtToken = KJUR.jws.JWS.sign("RS256", sHeader, sClaim, FIREBASE_PRIVATE_KEY);

            const response = await fetch("https://oauth2.googleapis.com/token", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${jwtToken}`
            });

            const data = await response.json();
            return data.access_token;
        }

        async function dispararNotificacaoV1(tokenAccessToken, packNome, packCategoria) {
            const fcmUrl = `https://fcm.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/messages:send`;
            
            const messageBody = {
                message: {
                    topic: "todos",
                    notification: {
                        title: "🔥 Novo Pack Liberado!",
                        body: `O pacote "${packNome}" [${packCategoria}] já está disponível no PenSound!`
                    },
                    android: {
                        priority: "HIGH",
                        notification: {
                            sound: "default",
                            channel_id: "pensound_notifications"
                        }
                    }
                }
            };

            await fetch(fcmUrl, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${tokenAccessToken}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(messageBody)
            });
        }

        document.getElementById('packForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;

            try {
                const token = document.getElementById('ghToken').value;
                const cards = document.querySelectorAll('.pack-item');
                
                btn.innerText = "Lendo repositório...";
                const ghUrl = `https://api.github.com/repos/${REPO}/contents/pacotes.json`;
                const currentData = await fetch(ghUrl).then(r => r.json());
                
                const contentText = decodeURIComponent(escape(atob(currentData.content))).trim();
                let content = [];
                try {
                    content = contentText ? JSON.parse(contentText) : [];
                } catch (err) {
                    content = [];
                }

                let pacotesAdicionados = 0;
                let ultimosPacotes = [];

                for (let i = 0; i < cards.length; i++) {
                    const card = cards[i];
                    
                    const nome = card.querySelector('.input-nome').value.trim();
                    const categoria = card.querySelector('.input-categoria').value;
                    const capaInput = card.querySelector('.input-capa');
                    const file = capaInput.files ? capaInput.files[0] : null;
                    const download = card.querySelector('.input-download').value.trim();

                    if (nome && file && download) {
                        btn.innerText = `Enviando capa ${i + 1} de ${cards.length}: ${nome}...`;

                        const formData = new FormData();
                        formData.append('file', file);
                        formData.append('upload_preset', UPLOAD_PRESET);

                        const resImg = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                            method: 'POST',
                            body: formData
                        }).then(r => r.json());

                        if (!resImg.secure_url) {
                            throw new Error(`Falha no upload da foto do pacote: ${nome}`);
                        }

                        const novoPack = {
                            id: (Date.now() + i).toString(),
                            nome: nome,
                            title: nome,
                            categoria: categoria,
                            type: categoria,
                            capa: resImg.secure_url,
                            cover_url: resImg.secure_url,
                            download: download,
                            zip_url: download
                        };

                        content.push(novoPack);
                        ultimosPacotes.push(novoPack);
                        pacotesAdicionados++;
                    }
                }

                if (pacotesAdicionados === 0) {
                    throw new Error("Preencha o Nome, Capa e Link do ZIP de pelo menos um pacote!");
                }

                btn.innerText = "Atualizando GitHub...";
                const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2))));

                const ghRes = await fetch(ghUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Adicionados ${pacotesAdicionados} pacotes em lote`,
                        content: updatedContent,
                        sha: currentData.sha
                    })
                });

                if (!ghRes.ok) throw new Error("Erro ao salvar no GitHub. Verifique o seu token PAT.");

                btn.innerText = "Disparando notificações para o celular...";
                try {
                    const accessToken = await getFirebaseAccessToken();
                    for (const pack of ultimosPacotes) {
                        await dispararNotificacaoV1(accessToken, pack.nome, pack.categoria);
                    }
                } catch (fcmErr) {
                    console.error("Erro ao enviar notificação FCM V1:", fcmErr);
                }

                alert(`${pacotesAdicionados} pacote(s) publicado(s) e notificação enviada aos celulares!`);
                location.reload();
            } catch (err) {
                alert('Erro ao publicar: ' + err.message);
                btn.disabled = false;
                btn.innerText = "PUBLICAR E NOTIFICAR APP";
            }
        });
    </script>
