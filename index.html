<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel PenSound</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background: #121212; color: #fff; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; background: #1e1e1e; color: #fff; border: 1px solid #333; border-radius: 4px; }
        button { background: #6200ee; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:disabled { background: #444; }
    </style>
</head>
<body>
    <h2>PenSound - Painel Admin</h2>
    <form id="packForm">
        <label>Nome do Pacote:</label>
        <input type="text" id="nome" required placeholder="Ex: Pagodão 2026">
        
        <label>Categoria:</label>
        <select id="categoria" required>
            <option value="PAGODAO">PAGODÃO</option>
            <option value="ARROCHA">ARROCHA</option>
            <option value="FORRO">FORRÓ</option>
            <option value="FUNK">FUNK</option>
            <option value="REPERTORIO">REPERTÓRIO</option>
            <option value="OUTROS">OUTROS</option>
        </select>

        <label>Capa (Imagem):</label>
        <input type="file" id="capa" accept="image/*" required>
        
        <label>Link do ZIP (Download Direto):</label>
        <input type="url" id="download" required placeholder="https://download...mediafire.com/...">
        
        <label>Token do GitHub (PAT):</label>
        <input type="password" id="ghToken" required placeholder="ghp_xxxx...">
        
        <button type="submit" id="btnSubmit">Publicar Pacote</button>
    </form>

    <script>
        const CLOUD_NAME = "y5u5zkp7";
        const UPLOAD_PRESET = "ftpuvxis";
        const REPO = "thsize/botpensound";

        document.getElementById('packForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = "Enviando capa...";

            try {
                const token = document.getElementById('ghToken').value;
                const nome = document.getElementById('nome').value;
                const categoria = document.getElementById('categoria').value;
                const download = document.getElementById('download').value;
                const file = document.getElementById('capa').files[0];

                // 1. Upload da Capa no Cloudinary
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', UPLOAD_PRESET);

                const resImg = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                    method: 'POST', 
                    body: formData
                }).then(r => r.json());

                if (!resImg.secure_url) {
                    throw new Error(resImg.error?.message || "Falha no upload da imagem para o Cloudinary.");
                }

                btn.innerText = "Atualizando GitHub...";

                // 2. Buscar pacotes.json do GitHub
                const ghUrl = `https://api.github.com/repos/${REPO}/contents/pacotes.json`;
                const currentData = await fetch(ghUrl).then(r => r.json());
                
                // Decodifica o JSON existente
                const contentText = decodeURIComponent(escape(atob(currentData.content)));
                const content = JSON.parse(contentText);

                // 3. Adicionar novo pacote com campos de Categoria salvos
                content.push({
                    id: Date.now().toString(),
                    nome: nome,
                    title: nome,
                    categoria: categoria,
                    type: categoria,
                    capa: resImg.secure_url,
                    cover_url: resImg.secure_url,
                    download: download,
                    zip_url: download
                });

                // 4. Salvar de volta no GitHub
                const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2))));

                const ghRes = await fetch(ghUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Adicionado pacote: ${nome} [${categoria}]`,
                        content: updatedContent,
                        sha: currentData.sha
                    })
                });

                if (!ghRes.ok) {
                    throw new Error("Erro ao atualizar o GitHub. Verifique o seu token PAT.");
                }

                alert('Pacote publicado com sucesso!');
                location.reload();
            } catch (err) {
                alert('Erro ao publicar: ' + err.message);
                btn.disabled = false;
                btn.innerText = "Publicar Pacote";
            }
        });
    </script>
</body>
</html>
